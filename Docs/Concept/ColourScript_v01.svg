<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="520"><title>Colour script v0.1</title><rect width="1600" height="520" fill="white"/><text x="60" y="70" font-family="'Baloo 2','Fredoka','Trebuchet MS',Arial,sans-serif" font-size="38" font-weight="800" fill="#2A2438">Colour script v0.1</text><text x="60" y="104" font-family="'Baloo 2','Fredoka','Trebuchet MS',Arial,sans-serif" font-size="19" fill="#2A2438" opacity="0.75">Snow is never pure white: warm cream in light, lavender-blue in shade. Team colours chosen to pop on snow and stay distinct for colour-blind players.</text><rect x="60" y="140" width="120" height="160" rx="16" fill="#F7F4EE" stroke="#2A2438" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="60" y="330" font-family="'Baloo 2','Fredoka','Trebuchet MS',Arial,sans-serif" font-size="15" font-weight="700" fill="#2A2438">Snow Light</text><text x="60" y="352" font-family="'Baloo 2','Fredoka','Trebuchet MS',Arial,sans-serif" font-size="14" fill="#2A2438" opacity="0.7">#F7F4EE</text><rect x="196" y="140" width="120" height="160" rx="16" fill="#AFC2E8" stroke="#2A2438" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="196" y="330" font-family="'Baloo 2','Fredoka','Trebuchet MS',Arial,sans-serif" font-size="15" font-weight="700" fill="#2A2438">Snow Shadow</text><text x="196" y="352" font-family="'Baloo 2','Fredoka','Trebuchet MS',Arial,sans-serif" font-size="14" fill="#2A2438" opacity="0.7">#AFC2E8</text><rect x="332" y="140" width="120" height="160" rx="16" fill="#6E7FB8" stroke="#2A2438" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="332" y="330" font-family="'Baloo 2','Fredoka','Trebuchet MS',Arial,sans-serif" font-size="15" font-weight="700" fill="#2A2438">Deep Shadow</text><text x="332" y="352" font-family="'Baloo 2','Fredoka','Trebuchet MS',Arial,sans-serif" font-size="14" fill="#2A2438" opacity="0.7">#6E7FB8</text><rect x="468" y="140" width