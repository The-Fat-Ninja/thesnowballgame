 r="30" fill="#7A4FD6" stroke="#2A2438" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="470" cy="438" r="30" fill="#F28C28" stroke="#2A2438" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="630" cy="438" r="30" fill="#7A4FD6" stroke="#2A2438" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="800" y="430" font-family="'Baloo 2','Fredoka','Trebuchet MS',Arial,sans-serif" font-size="17" fill="#2A2438">Team colours over lit and shaded snow. Team is always shown by colour <tspan font-weight="800">and</tspan> shape</text><text x="800" y="456" font-family="'Baloo 2','Fredoka','Trebuchet MS',Arial,sans-serif" font-size="17" fill="#2A2438">(flag badge over each kid), never colour alone.</text></svg>
