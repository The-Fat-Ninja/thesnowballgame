"round"/><circle cx="254" cy="791" r="12" fill="#F28C28" stroke="#2A2438" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="288" cy="791" r="12" fill="#E3DCCF" stroke="#2A2438" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="322" cy="791" r="12" fill="#E3DCCF" stroke="#2A2438" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="356" cy="791" r="12" fill="#E3DCCF" stroke="#2A2438" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="410" y="650" font-family="'Baloo 2','Fredoka','Trebuchet MS',Arial,sans-serif" font-size="19" font-weight="800" fill="#2A2438">Run-up</text><text x="410" y="671" font-family="'Baloo 2','Fredoka','Trebuchet MS',Arial,sans-serif" font-size="14" fill="#2A2438" opacity="0.8">throws after moving are faster</text><text x="410" y="696" font-family="'Baloo 2','Fredoka','Trebuchet MS',Arial,sans-serif" font-size="19" font-weight="800" fill="#2A2438">Bouncer</text><text x="410" y="717" font-family="'Baloo 2','Fredoka','Trebuchet MS',Arial,sans-serif" font-size="14" fill="#2A2438" opacity="0.8">flat, very fast, ignores wind</text><text x="410" y="742" font-family="'Baloo 2','Fredoka','Trebuchet MS',Arial,sans-serif" font-size="19" font-weight="800" fill="#2A2438">Spinner</text><text x="410" y="763" font-family="'Baloo 2','Fredoka','Trebuchet MS',Arial,sans-serif" font-size="14" fill="#2A2438" opacity="0.8">curves round the edge of cover</text><text x="410" y="788" font-family="'Baloo 2','Fredoka','Trebuchet MS',Arial,sans-serif" font-size="19" font-weight="800" fill="#2A2438">★ Hat-trick</text><text x="410" y="809" font-family="'Baloo 2','Fredoka','Trebuchet MS',Arial,sans-serif" font-size="14" fill="#2A2438" opacity="0.8">three throws, three targets</text><line x1="96" y1="840" x2="664" y2="840" stroke="#2A2438" stroke-width="2" opacity="0.25"/><text x="96" y="874" font-family="'Baloo 2','Fredoka','Trebuchet MS',Arial,sans-serif" font-size="17" fill="#2A2438"><tspan font-weight="800">Likes:</tspan> cricket, keeping score, being right</text><text x="96" y="902" font-family="'Baloo 2','Fredoka','Trebuchet MS',Arial,sans-serif" font-size="17" fill="#2A2438"><tspan font-weight="800">Dislikes:</tspan> wet socks, “that didn’t count”</text><text x="96" y="936" font-family="'Baloo 2','Fredoka','Trebuchet MS',Arial,sans-serif" font-size="17" fill="#2A2438" opacity="0.85">Fastest bowler in Year 6. Wears her dad’s goalkeeping gloves</text><text x="96" y="958" font-family="'Baloo 2','Fredoka','Trebuchet MS',Arial,sans-serif" font-size="17" fill="#2A2438" opacity="0.85">over her mittens. Keeps score out loud. Always.</text><rect x="510" y="866" width="150" height="54" rx="27" fill="#2A2438"/><text x="585" y="901" text-anchor="middle" font-family="'Baloo 2','Fredoka','Trebuchet MS',Arial,sans-serif" font-size="24" font-weight="900" fill="white">“Howzat!”</text></svg>
